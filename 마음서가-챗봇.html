<title>마음 서가 챗봇</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: one-column chat window, like a librarian's reading-desk counter — header, tabs (규칙 / AI), scrolling thread, input dock */
:root {
  --bg: #eef1ef;
  --panel: #ffffff;
  --ink: #1f2a26;
  --muted: #5f6d67;
  --line: #d6ddd9;
  --accent: #2f5d50;        /* library-lamp green */
  --accent-ink: #ffffff;
  --user-bubble: #2f5d50;
  --bot-bubble: #f4f6f5;
  --chip: #e3ebe7;
  --spine: #b9834a;          /* book-spine brass */
  --ai: #5b4fb0;             /* AI 탭 표시 색 */
  --font-display: "Gowun Batang", "Noto Serif KR", serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131816; --panel: #1b2220; --ink: #e6ece9; --muted: #9aa8a2; --line: #2c3633;
    --accent: #7fb8a4; --accent-ink: #10201a; --user-bubble: #3d7564; --bot-bubble: #232c29;
    --chip: #26322e; --spine: #d3a571; --ai: #b3a8f0; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131816; --panel: #1b2220; --ink: #e6ece9; --muted: #9aa8a2; --line: #2c3633;
  --accent: #7fb8a4; --accent-ink: #10201a; --user-bubble: #3d7564; --bot-bubble: #232c29;
  --chip: #26322e; --spine: #d3a571; --ai: #b3a8f0; color-scheme: dark;
}
/* 시간대별 채팅창 색 (새벽 0–6시, 아침 6–11시, 낮 11–18시, 밤 18–24시) */
:root { --sky1: #ffffff; --sky2: #ffffff; }
:root[data-time="dawn"]    { --sky1: #e1e4f3; --sky2: #f6e8ee; }
:root[data-time="morning"] { --sky1: #fff0db; --sky2: #edf5f8; }
:root[data-time="day"]     { --sky1: #dcf0fa; --sky2: #f0f8f3; }
:root[data-time="night"]   {
  --sky1: #222a4d; --sky2: #383d68;
  /* 밤 채팅창은 어두우므로 글자·말풍선도 밝게 */
  --ink: #eceff8; --muted: #aab1cf; --line: #48507e; --panel: #2c3460;
  --bot-bubble: #323b6a; --chip: #3a4374; --accent: #9fcfbd; --accent-ink: #13231d; --user-bubble: #3d7564; --ai: #c3b9ff;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"])[data-time="dawn"]    { --sky1: #1c2135; --sky2: #382c3f; }
  :root:not([data-theme="light"])[data-time="morning"] { --sky1: #3a2b20; --sky2: #1e2a31; }
  :root:not([data-theme="light"])[data-time="day"]     { --sky1: #14303e; --sky2: #192a25; }
  :root:not([data-theme="light"])[data-time="night"]   { --sky1: #090e1e; --sky2: #191e3a;
    --ink: #e6ece9; --muted: #9aa8a2; --line: #2c3633; --panel: #1b2220; --bot-bubble: #232c29; --chip: #26322e; --accent: #7fb8a4; --accent-ink: #10201a; --ai: #b3a8f0; }
}
:root[data-theme="dark"][data-time="dawn"]    { --sky1: #1c2135; --sky2: #382c3f; }
:root[data-theme="dark"][data-time="morning"] { --sky1: #3a2b20; --sky2: #1e2a31; }
:root[data-theme="dark"][data-time="day"]     { --sky1: #14303e; --sky2: #192a25; }
:root[data-theme="dark"][data-time="night"]   { --sky1: #090e1e; --sky2: #191e3a;
  --ink: #e6ece9; --muted: #9aa8a2; --line: #2c3633; --panel: #1b2220; --bot-bubble: #232c29; --chip: #26322e; --accent: #7fb8a4; --accent-ink: #10201a; --ai: #b3a8f0; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px; box-sizing: border-box;
  display: flex; justify-content: center;
}
.app {
  width: 100%; max-width: 560px; height: 100%; display: flex; flex-direction: column;
  background: var(--panel); background: linear-gradient(170deg, var(--sky1), var(--sky2)); color: var(--ink);
  border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
}
header {
  display: flex; align-items: center; gap: 12px; padding: 14px 18px 10px;
}
header { border-bottom: 1px solid var(--line); padding-bottom: 12px; }
.bubble a { color: var(--accent); font-weight: 600; }
.avatar {
  width: 38px; height: 38px; border-radius: 50%; background: var(--accent); color: var(--accent-ink);
  display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 17px; flex: none;
}
header h1 { font-family: var(--font-display); font-size: 18px; margin: 0; font-weight: 700; }
header p { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }
.timebtn {
  margin-left: auto; font: inherit; font-size: 11.5px; color: var(--ink); background: var(--chip);
  border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; cursor: pointer; white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.timebtn:hover { border-color: var(--accent); }
.badge {
  font-size: 11px; letter-spacing: .04em; color: var(--muted);
  border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px; white-space: nowrap;
}
/* 탭 */
.tabs { display: flex; gap: 0; padding: 0 18px; border-bottom: 1px solid var(--line); }
.tab {
  font: inherit; font-size: 13.5px; background: none; border: 0; color: var(--muted); cursor: pointer;
  padding: 8px 12px 9px; border-bottom: 2px solid transparent; margin-bottom: -1px;
  display: flex; align-items: center; gap: 6px;
}
.tab .tag { font-size: 10.5px; letter-spacing: .05em; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
.tab[aria-selected="true"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--accent); }
.tab.ai[aria-selected="true"] { border-bottom-color: var(--ai); }
.tab.ai .tag { color: var(--ai); border-color: var(--ai); }
.pane { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.pane[hidden] { display: none; }
.pane-note { font-size: 12px; color: var(--muted); padding: 8px 18px 0; line-height: 1.5; }
.thread {
  flex: 1; overflow-y: auto; padding: 14px 18px 18px; display: flex; flex-direction: column; gap: 14px;
}
.divider { text-align: center; font-size: 11.5px; color: var(--muted); letter-spacing: .04em; }
.row { display: flex; gap: 8px; align-items: flex-end; }
.row.user { justify-content: flex-end; }
.bubble {
  max-width: 85%; min-width: 0; padding: 10px 14px; border-radius: 16px; line-height: 1.6; word-break: keep-all; overflow-wrap: anywhere;
}
.bot .bubble { background: var(--bot-bubble); border-bottom-left-radius: 4px; }
.user .bubble { background: var(--user-bubble); color: #fff; border-bottom-right-radius: 4px; }
.bubble strong { font-weight: 600; }
.books { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.book {
  display: grid; grid-template-columns: 6px 1fr; gap: 12px; background: var(--panel);
  border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px 10px 0; overflow: hidden;
}
.book::before { content: ""; background: var(--spine); border-radius: 0 3px 3px 0; }
.book .no { font-size: 11px; color: var(--muted); letter-spacing: .05em; }
.book .title { font-family: var(--font-display); font-weight: 700; font-size: 16px; margin: 1px 0; }
.book .author { font-size: 12.5px; color: var(--muted); }
.book .why { font-size: 13.5px; margin-top: 6px; line-height: 1.55; }
.buy { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-top: 8px; font-size: 11.5px; color: var(--muted); }
.buy a {
  font-size: 11.5px; color: var(--accent); text-decoration: none; border: 1px solid var(--line);
  border-radius: 999px; padding: 2px 8px; line-height: 1.5;
}
.buy a:hover { border-color: var(--accent); }
.buy a:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
/* AI가 이해한 내용 */
.understood {
  border-left: 3px solid var(--ai); padding: 2px 0 2px 10px; margin-bottom: 8px; font-size: 13.5px;
}
.understood .label { display: block; font-size: 11px; color: var(--ai); letter-spacing: .05em; font-weight: 600; }
.understood .meta { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
.notice { margin: 0 0 6px; font-size: 13px; color: var(--ai); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip {
  font: inherit; font-size: 13px; border: 1px solid transparent; background: var(--chip); color: var(--ink);
  border-radius: 999px; padding: 5px 12px; cursor: pointer; text-align: left;
}
.chip:hover { border-color: var(--accent); }
.chip.say { border-style: dashed; border-color: var(--line); }
.refine { font-size: 12px; color: var(--muted); margin-top: 12px; letter-spacing: .02em; }
.chip.all { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.chip:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.typing span {
  display: inline-block; width: 6px; height: 6px; margin: 0 2px; border-radius: 50%; background: var(--muted);
  animation: blink 1s infinite ease-in-out;
}
.typing span:nth-child(2) { animation-delay: .15s; } .typing span:nth-child(3) { animation-delay: .3s; }
.typing em { font-style: normal; font-size: 12.5px; color: var(--muted); margin-left: 6px; }
@keyframes blink { 0%,80%,100% { opacity: .25 } 40% { opacity: 1 } }
@media (prefers-reduced-motion: reduce) { .typing span { animation: none; opacity: .6; } }
form {
  display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); background: transparent;
}
.msg {
  flex: 1; min-width: 0; font: inherit; color: var(--ink); background: var(--panel);
  border: 1px solid var(--line); border-radius: 999px; padding: 10px 16px;
}
.send {
  font: inherit; font-weight: 600; border: 0; border-radius: 999px; padding: 0 18px;
  background: var(--accent); color: var(--accent-ink); cursor: pointer;
}
.send:disabled, .msg:disabled { opacity: .5; cursor: default; }
@media (max-width: 420px) { .badge { display: none; } .thread { padding: 12px 14px 14px; } .tabs, .pane-note { padding-left: 14px; padding-right: 14px; } }
</style>

<div class="app">
  <header>
    <div class="avatar" aria-hidden="true">책</div>
    <div>
      <h1>마음 서가</h1>
      <p>지금 감정을 말해주면 책 3권을 골라드려요</p>
    </div>
    <button type="button" id="timeBtn" class="timebtn" title="눌러서 다른 시간대 배경 미리보기"></button>
    <span class="badge">프로토타입</span>
  </header>
  <section class="pane" id="pane-ai">
    <p class="pane-note">Claude가 문장의 뜻을 이해해서 같은 책 72권 중에서 골라요. 겪은 일만 말해도 감정을 짐작하고, 이미 소개한 책은 다시 추천하지 않아요.</p>
    <div class="thread" aria-live="polite"></div>
    <form autocomplete="off">
      <input id="msg-ai" class="msg" type="text" placeholder="예: 하나도 안 슬픈데 그냥 심심해" aria-label="감정 입력 (AI)">
      <button class="send" type="submit">보내기</button>
    </form>
  </section>
</div>

<script>

/* 채팅창 하나를 만드는 틀: respond(text) → html (Promise 가능) */
function makeChat(pane, respond, onChip) {
  const thread = pane.querySelector(".thread");
  const input = pane.querySelector(".msg");
  const send = pane.querySelector(".send");
  let busy = false;
  const chat = {
    thread, input, send,
    addRow(who, html) {
      const row = document.createElement("div");
      row.className = "row " + who;
      row.innerHTML = `<div class="bubble">${html}</div>`;
      thread.appendChild(row);
      thread.scrollTop = thread.scrollHeight;
      return row;
    },
    divider(text) {
      const d = document.createElement("div");
      d.className = "divider"; d.textContent = text; thread.appendChild(d);
    },
    async run(userText, work, typingLabel) {
      if (busy) return;
      busy = true; send.disabled = true;
      if (userText) chat.addRow("user", esc(userText));
      const row = chat.addRow("bot", TYPING(typingLabel));
      const bubble = row.querySelector(".bubble");
      try { bubble.innerHTML = await work(); }
      catch (e) { bubble.innerHTML = "답을 만들지 못했어요. 다시 보내 주세요."; }
      thread.scrollTop = thread.scrollHeight;
      busy = false; if (!chat.locked) { send.disabled = false; input.focus(); }
    },
    ask(text) { text = text.trim(); if (text) respond(text, chat); },
    lock(message) { chat.locked = true; input.disabled = true; send.disabled = true; input.placeholder = message; }
  };
  pane.querySelector("form").addEventListener("submit", e => {
    e.preventDefault(); const t = input.value; input.value = ""; chat.ask(t);
  });
  thread.addEventListener("click", e => {
    const c = e.target.closest(".chip");
    if (!c || busy || chat.locked) return;
    if (onChip && onChip(c, chat)) return;
    if (c.dataset.say) chat.ask(c.dataset.say);
  });
  return chat;
}

- 사용자가 "(감정 고침)"으로 감정을 바로잡으면 그 감정을 따르고, 직전 문장의 상황에 맞춰 다시 고른다.
- understanding: 사용자의 상태를 존댓말 한 문장으로. 경험에서 감정을 짐작했다면 무엇을 보고 짐작했는지 드러낸다.
- reason: 사용자가 한 말에 맞춘 추천 이유를 존댓말 한 문장(50자 안팎)으로.
- note: 장르 책이 부족한 등 알려줄 점이 있으면 한 문장, 없으면 null.

JSON 하나만 출력:
{"emotions":["불안"],"genre":"소설" 또는 null,"genre_only":false,"understanding":"...","question":null 또는 "...","note":null 또는 "...","picks":[{"id":3,"reason":"..."}]}

도서 목록 (id|감정|장르|제목|저자):
${catalogText}

이미 소개한 책 id: ${shownList || "없음"}

이전 대화(오래된 순):
${past || "없음"}

이번 사용자 문장: ${text}`;
  }

  function renderResult(r, text) {
    const emotions = (Array.isArray(r?.emotions) ? r.emotions : []).filter(e => EMOTIONS.includes(e));
    const genre = Object.keys(GENRES).includes(r?.genre) ? r.genre : null;
    const genreOnly = r?.genre_only === true && !!genre;
    const fitsGenre = c => !genre || c.b[3] === genre;
    // 요구사항 1: 이 감정(과 장르)의 책을 이미 모두 소개했는지 — 이번 추천 전에 계산
    const exhausted = genreOnly ? [] : emotions.filter(e =>
      CATALOG.filter(c => c.emo === e && fitsGenre(c)).every(c => shown.has(c.id)));

    // AI가 고른 책 검사: 목록에 있는 id만, 중복 없이, (장르만 좁힐 때 빼고) 이미 소개한 책 제외
    const used = new Set();
    let picks = (Array.isArray(r?.picks) ? r.picks : [])
      .map(p => ({ c: CATALOG.find(c => c.id === Number(p?.id)), reason: p?.reason }))
      .filter(p => p.c && fitsGenre(p.c) && !used.has(p.c.id) && (genreOnly || !shown.has(p.c.id)) && used.add(p.c.id))
      .slice(0, 3);

    // 모자라면 채우기: 같은 감정의 아직 소개 안 한 책 → (모두 소개했을 때만) 다른 감정의 책
    if (emotions.length && picks.length < 3) {
      const free = c => !used.has(c.id) && (genreOnly || !shown.has(c.id)) && fitsGenre(c);
      const add = c => { used.add(c.id); picks.push({ c, reason: null }); };
      CATALOG.filter(c => emotions.includes(c.emo) && free(c)).forEach(c => picks.length < 3 && add(c));
      if (picks.length < 3 && exhausted.length && !genre) {
        CATALOG.filter(c => free(c)).forEach(c => picks.length < 3 && add(c));
      }
    }

    history.push({ user: text, emotions, genre });
    lastText = text;
    picks.forEach(p => shown.add(p.c.id));

    const meta = `감정: ${emotions.join(", ") || "파악 못 함"} · 장르: ${genre || "지정 안 함"}`;
    let html = `<div class="understood"><span class="label">AI가 이해한 내용</span>${esc(r?.understanding || "")}<span class="meta">${meta}</span></div>`;
    if (!picks.length) {
      html += esc(r?.question || r?.note || "어떤 기분인지 조금 더 알려주세요.");
      html += emoChipsHTML();
      return html;
    }
    if (exhausted.length) html += `<p class="notice">${exhausted.join(", ")} 책은 이 대화에서 모두 소개해서, 비슷한 다른 책을 골랐어요.</p>`;
    if (r?.note) html += esc(r.note);
    html += cardsHTML(picks.map(p => [p.c.emo, p.c.b, p.reason]));
    html += `<div class="chips"><button type="button" class="chip" data-say="다른 책도 알려줘">다른 책도 알려줘</button><button type="button" class="chip" data-fix="1">다른 감정이에요</button></div>`;
    return html;
  }

  const ERR = {
    not_granted: "AI 사용이 허용되지 않아 쓸 수 없어요. <a href='https://claude.ai/artifact/DcTjvrmgSYxng7pxSosnL5' target='_blank' rel='noopener'>마음 서가(탭1)</a>을 이용해 주세요.",
    sampling_disabled: "이 계정에서는 AI를 쓸 수 없어요. <a href='https://claude.ai/artifact/DcTjvrmgSYxng7pxSosnL5' target='_blank' rel='noopener'>마음 서가(탭1)</a>을 이용해 주세요.",
    rate_limited: "요청이 많아 잠시 쉬어야 해요. 조금 뒤에 다시 보내 주세요.",
    invalid_json: "AI 답을 읽지 못했어요. 같은 문장을 다시 보내 주세요.",
    session_expired: "로그인이 만료됐어요. 다시 로그인한 뒤 보내 주세요.",
    refused: "이 문장으로는 답을 만들 수 없어요. 다르게 말해 주세요."
  };
  const LOCK = ["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"];

  // shownText: 말풍선에 보일 글, askText: AI에게 보낼 글
  function send(c, shownText, askText) {
    c.run(shownText, async () => {
      const sample = await getSample();
      if (!sample) { c.lock("이 화면에서는 AI를 쓸 수 없어요"); return "이 화면에서는 AI 기능을 쓸 수 없어요. <a href='https://claude.ai/artifact/DcTjvrmgSYxng7pxSosnL5' target='_blank' rel='noopener'>마음 서가(탭1)</a>을 이용해 주세요."; }
      try {
        const r = await sample.json(buildPrompt(askText), { modelTier: "quick", cache: false });
        return renderResult(r, askText);
      } catch (e) {
        if (LOCK.includes(e?.code)) c.lock("AI를 쓸 수 없어요");
        return ERR[e?.code] || "AI 답을 받지 못했어요. 잠시 뒤 다시 보내 주세요.";
      }
    }, "AI가 문장을 읽는 중");
  }

  const chat = makeChat(document.getElementById("pane-ai"),
    (text, c) => send(c, text, text),
    (chip, c) => {
      // 요구사항 2-③: 짐작한 감정 고치기
      if (chip.dataset.fix) {
        c.addRow("bot", `어떤 감정에 더 가까운가요? 고르면 그 감정으로 다시 추천해 드릴게요.<div class="chips">${EMOTIONS.map(e =>
          `<button type="button" class="chip" data-fixemo="${e}">${e}</button>`).join("")}</div>`);
        return true;
      }
      if (chip.dataset.fixemo) {
        const e = chip.dataset.fixemo;
        send(c, `${e}에 더 가까워요`, `(감정 고침) 내 감정은 ${e}이야. 직전에 말한 "${lastText}"를 ${e} 기준으로 다시 추천해줘`);
        return true;
      }
      return false;
    });
  chat.addRow("bot", `안녕하세요! 마음 서가는 AI가 문장의 뜻을 이해해서 책을 골라요. 기분이나 겪은 일을 편하게 말해 주세요. 장르를 함께 말해도 되고, 앞에서 한 말과 이미 소개한 책도 기억해요.${compareChipsHTML()}`);
  chat.divider("처음 보낼 때 AI 사용 허용을 한 번 물어봐요");
  getSample().then(s => { if (!s) chat.lock("이 화면에서는 AI를 쓸 수 없어요"); });
  chat.thread.scrollTop = 0;
  return chat;
})();

/* ───────── 시간대 배경: 보는 사람의 기기 시간 기준, 1분마다 갱신 ───────── */
const PERIODS = [["dawn", "새벽"], ["morning", "아침"], ["day", "낮"], ["night", "밤"]];
const timeBtn = document.getElementById("timeBtn");
let preview = -1; // -1 = 자동(현재 시간)
function periodOf(h) { return h < 6 ? 0 : h < 11 ? 1 : h < 18 ? 2 : 3; }
function applyTime() {
  const now = new Date();
  const idx = preview >= 0 ? preview : periodOf(now.getHours());
  document.documentElement.dataset.time = PERIODS[idx][0];
  const hhmm = String(now.getHours()).padStart(2, "0") + ":" + String(now.getMinutes()).padStart(2, "0");
  timeBtn.textContent = preview >= 0 ? `${PERIODS[idx][1]} · 미리보기` : `${PERIODS[idx][1]} · ${hhmm}`;
}
timeBtn.addEventListener("click", () => { preview = preview >= PERIODS.length - 1 ? -1 : preview + 1; applyTime(); });
applyTime();
setInterval(applyTime, 60000);
</script>
