# main 브랜치에 push하면 AI 스튜디오 버전(React 앱)을 빌드해 GitHub Pages로 배포한다.
# GitHub Pages에는 서버가 없으므로 정적 모드(VITE_STATIC_MODE)로 빌드한다:
#   - 책 추천은 AI 대신 화면 안의 규칙 기반 추천으로 동작
#   - 관리자 콘솔은 숨김
# 기존 주소가 깨지지 않도록 Claude 버전(마음서가-챗봇.html)과 hello.html도 같이 올린다.
name: GitHub Pages 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 패키지 설치
        run: npm ci

      - name: 화면 빌드 (정적 모드)
        env:
          VITE_STATIC_MODE: 'true'
        run: npm run build -- --base=/${{ github.event.repository.name }}/

      - name: 기존 페이지 함께 넣기
        run: |
          cp "마음서가-챗봇.html" dist/
          cp hello.html dist/
          cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
